name: deploy

# Deploys the highest version tag with no label to the GRIMOIRE host every night, and on a manual run. It releases
# that tag, then starts the host's deploy service through its own runner. The host deploys the tag when it is higher
# than the active release and was never installed before: it builds the tag, applies its pending Flyway migrations
# (sql/flyway/migrate.sh) and stops with the live release unchanged when one fails, then switches over and keeps the
# release only when it answers its health check, restoring the one before it otherwise. A pushed tag starts nothing:
# it waits for the next scheduled run.
# Needs the self-hosted runner labeled `grimoire` on the host, with a sudoers rule to start grimoire-deploy.service,
# and a host deploy script that deploys the highest version tag. No secrets.
on:
  schedule:
    - cron: "15 3 * * *" # Run after the host's 03:00 restart
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Pick the highest version tag with no label, or none when the repository has none
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Pick the tag
        id: pick
        run: |
          tag=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag to deploy: ${tag:-none}"

  release:
    needs: pick
    if: needs.pick.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.pick.outputs.tag }}

  deploy:
    needs: release
    runs-on: [self-hosted, grimoire]
    steps:
      - name: Deploy the highest version tag
        run: sudo /usr/bin/systemctl start grimoire-deploy.service
